name: CI/CD Pipeline for 6 Services

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/phishing-detector-app

jobs:
  # ==========================================
  # ЭТАП 1: СБОРКА И ТЕСТИРОВАНИЕ (Матрица)
  # ==========================================
  build-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 3 сервиса, у которых есть реальные тесты
          - service: scan-service
            check: "pytest app/test_all.py -q -m 'scan'"
          - service: api-gateway
            check: "pytest app/test_all.py -q -m 'gateway'"
          # 4 сервиса-заглушки (проверка синтаксиса)
          - service: visual-service
            check: "python -m py_compile app/analyzers.py"
          - service: text-service
            check: "python -m py_compile app/analyzers.py"
          - service: domain-service
            check: "python -m py_compile app/analyzers.py"
          - service: notification-service
            check: "python -m py_compile app/notification.py"
          - service: monitoring-service
            check: "python -m py_compile app/monitoring.py"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx pydantic cachetools PyJWT pytest pytest-asyncio

      - name: "Build & Test: ${{ matrix.service }}"
        run: ${{ matrix.check }}

  # ==========================================
  # ЭТАП 2: ПУБЛИКАЦИЯ (CD)
  # ==========================================
  publish-image:
    needs: build-services # Запускается только если все 7 проверок прошли успешно
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
