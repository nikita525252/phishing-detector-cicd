name: CI/CD Pipeline for 6 Services

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/phishing-detector-app

jobs:
  # 1. СБОРКА И ТЕСТЫ ДЛЯ КАЖДОГО СЕРВИСА (МАТРИЦА)
  test-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [scan-service, visual-service, text-service, domain-service, notification-service, monitoring-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx pydantic cachetools PyJWT pytest pytest-asyncio

      - name: "Testing service: ${{ matrix.service }}"
        run: |
          echo "Запуск тестов для сервиса: ${{ matrix.service }}"
          # В реальности здесь были бы тесты для конкретного сервиса, 
          # но у нас они общие, поэтому просто прогоняем весь файл
          pytest app/test_all.py -q

  # 2. СБОРКА ОБЩЕГО DOCKER-ОБРАЗА (CD)
  build-and-push:
    needs: test-services # Ждем, пока пройдут тесты всех сервисов
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
